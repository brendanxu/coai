    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #index-loading {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #F4EFE5; /* gt v0.7 warm cream */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        @media (prefers-color-scheme: dark) {
            html[data-theme="system"] #index-loading {
                background-color: #1A130E; /* gt v0.7 ink-deep umber */
            }
        }

        html[data-theme="dark"] #index-loading {
            background-color: #1A130E; /* gt v0.7 ink-deep umber */
        }

        .loading-icon {
            width: 48px;
            height: 48px;
            background-image: url('/logo.svg');
            background-size: contain;
            background-repeat: no-repeat;
        }

        @media (min-width: 768px) {
            .loading-icon {
                width: 80px;
                height: 80px;
            }
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(45, 90, 61, 0.15); /* gt-moss tinted */
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 40%;
            background: #2D5A3D; /* gt-moss */
            animation: loading 1.5s infinite ease-in-out;
            border-radius: 2px;
        }

        @keyframes loading {
            0% {
                left: -40%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
    <script>
        // Sync inline theme bootstrap — runs before any paint, before React mounts.
        // Strategy (per founder 2026-05-09):
        //   - User explicit toggle (Header lang/theme picker) always wins.
        //   - Marketing routes WITHOUT explicit pref → 'system' (auto-switch
        //     by the device's prefers-color-scheme: light during day, dark
        //     at night via iOS/Android Auto-Dark Mode). This is the
        //     "随着时间自动切换" behavior founder asked for.
        //   - App routes (chat/admin/etc.) WITHOUT explicit pref → CoAI's
        //     original 'dark' default to preserve in-app aesthetic.
        // Visual contrast in dark mode is handled by --ink-foreground +
        // --ink-accent inversions in src/assets/globals.less .dark block.
        //
        // KEEP THIS LIST IN SYNC with MARKETING_PATHS in
        // src/routes/Index.tsx and ThemeProvider.tsx. Inline duplication is
        // intentional — runs before any module loads.
        (function () {
            const MARKETING = new Set([
                '/', '/pricing', '/contact', '/privacy', '/terms', '/about',
                '/pool', '/token-plans', '/services', '/services/mansu',
            ]);
            const path = window.location.pathname;
            const isMarketing = MARKETING.has(path);
            const stored = localStorage.getItem('theme');
            const userExplicit = stored === 'light' || stored === 'dark' || stored === 'system';
            // Effective theme:
            //   - User explicit -> respect (any route)
            //   - Marketing + no pref -> 'system' (auto-switch)
            //   - App + no pref -> 'dark' (CoAI default)
            let effective;
            if (userExplicit) {
                effective = stored;
            } else if (isMarketing) {
                effective = 'system';
            } else {
                effective = 'dark';
            }
            document.documentElement.setAttribute('data-theme', effective);
            const klass = effective === 'system'
                ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                : effective;
            document.documentElement.classList.add(klass);
        })();
    </script>
  </head>
  <body>
