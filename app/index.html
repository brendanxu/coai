<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>greentokey · your green key to AI</title>
    <meta name="keywords" content="greentokey, BYOK AI, sustainable AI, indie hacker, AI hub, multi-model, OpenAI, Claude, DeepSeek, Gemini">
    <meta name="description" content="greentokey — Sustainable BYOK AI hub for indie builders. Bring your own API keys. See your real-time carbon footprint. We never see your prompts.">
    <meta name="theme-color" content="#1F3A2E">
    <meta itemprop="image" content="/logo.svg">
    <meta property="og:title" content="greentokey — your green key to AI">
    <meta property="og:description" content="One key, every model. BYOK consolidation with hard cost cap, real-time CO₂ visibility, and zero prompt retention. Built for indie hackers.">
    <meta property="og:type" content="website">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
    <script src="/workbox.js" defer></script>
    <style>
        html, body, #root {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        #index-loading {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #E8E5DE; /* gt-stone */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        @media (prefers-color-scheme: dark) {
            html[data-theme="system"] #index-loading {
                background-color: #0F1A14; /* gt-cinder */
            }
        }

        html[data-theme="dark"] #index-loading {
            background-color: #0F1A14; /* gt-cinder */
        }

        .loading-icon {
            width: 48px;
            height: 48px;
            background-image: url('/logo.svg');
            background-size: contain;
            background-repeat: no-repeat;
        }

        @media (min-width: 768px) {
            .loading-icon {
                width: 80px;
                height: 80px;
            }
        }

        .loading-bar {
            width: 200px;
            height: 4px;
            background: rgba(45, 90, 61, 0.15); /* gt-moss tinted */
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 40%;
            background: #2D5A3D; /* gt-moss */
            animation: loading 1.5s infinite ease-in-out;
            border-radius: 2px;
        }

        @keyframes loading {
            0% {
                left: -40%;
            }
            100% {
                left: 100%;
            }
        }
    </style>
    <script>
        // Set theme based on localStorage and system preference
        const theme = localStorage.getItem('theme') || 'system';
        document.documentElement.setAttribute('data-theme', theme);
    </script>
  </head>
  <body>
    <div id="root">
      <div id="index-loading">
        <div class="loading-icon"></div>
        <div class="loading-bar"></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
